<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 950" width="1360" height="950" role="img" aria-label="System architecture. Offline: Loghub logs are downloaded, parsed with a Drain parser frozen at the time-split cut-off, grouped, labelled and split; the detectors are trained, tuned on validation and evaluated on random and time splits, including false alarms per day and an error analysis. The frozen parser, models and thresholds are saved and loaded once by the live system, so live decisions match the evaluation. Online: a log feed replays raw lines into the FastAPI scoring API, which decides when each group is finished, scores it from 0 to 1 with reasons, and saves the result in PostgreSQL on Neon; the Streamlit dashboard reads the results every 5 seconds for the operator. True labels are used only to grade the system." font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
    <marker id="a-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
    <marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#898781"/></marker>
  </defs>
  <rect x="0" y="0" width="1360" height="950" fill="#fcfcfb"/>

  <!-- ============ header ============ -->
  <text x="24" y="40" font-size="22" font-weight="700" fill="#0b0b0b">System architecture: detecting abnormal behaviour in software logs</text>
  <text x="24" y="66" font-size="13" fill="#52514e">Top: the offline pipeline that trains and evaluates the detectors.   Bottom: the live system that scores new log lines and shows alerts.</text>
  <rect x="24" y="90" width="34" height="20" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="66" y="105" font-size="12" fill="#52514e">built</text>
  <rect x="140" y="90" width="34" height="20" rx="4" fill="#ffffff" stroke="#52514e" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="182" y="105" font-size="12" fill="#52514e">optional extension, not built</text>
  <rect x="390" y="90" width="34" height="20" rx="4" fill="#e7e5df" stroke="#52514e" stroke-width="1.4"/>
  <text x="432" y="105" font-size="12" fill="#52514e">stored data / artefacts</text>
  <line x1="600" y1="100" x2="642" y2="100" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <text x="652" y="105" font-size="12" fill="#52514e">live data path</text>
  <line x1="770" y1="100" x2="812" y2="100" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-muted)"/>
  <text x="822" y="105" font-size="12" fill="#52514e">true labels: used only to grade, never live</text>

  <!-- ============ OFFLINE ============ -->
  <rect x="20" y="128" width="1320" height="342" rx="10" fill="#f4f3ef"/>
  <text x="40" y="153" font-size="12.5" font-weight="700" fill="#77756f" letter-spacing="0.6">OFFLINE · TRAINING AND EVALUATION PIPELINE (RUNS ON A LAPTOP CPU)</text>

  <!-- row 1 -->
  <rect x="40" y="168" width="180" height="150" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="54" y="194" font-size="14" font-weight="700" fill="#0b0b0b">Data sources</text>
  <text x="54" y="218" font-size="12" fill="#52514e">Loghub (Zenodo)</text>
  <text x="54" y="236" font-size="12" fill="#52514e">HDFS: 11.2M lines,</text>
  <text x="66" y="254" font-size="12" fill="#52514e">labels per block</text>
  <text x="54" y="272" font-size="12" fill="#52514e">BGL: 4.7M lines,</text>
  <text x="66" y="290" font-size="12" fill="#52514e">labels per line</text>

  <rect x="270" y="168" width="160" height="150" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="284" y="194" font-size="14" font-weight="700" fill="#0b0b0b">Download</text>
  <text x="284" y="218" font-size="12" fill="#52514e">01_download_data.py</text>
  <text x="284" y="236" font-size="12" fill="#52514e">MD5 checksum</text>
  <text x="284" y="254" font-size="12" fill="#52514e">unzip to data/raw/</text>

  <rect x="480" y="168" width="262" height="150" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="494" y="194" font-size="14" font-weight="700" fill="#0b0b0b">Preprocessing</text>
  <text x="494" y="218" font-size="12" fill="#52514e">02_preprocess.py</text>
  <text x="494" y="236" font-size="12" fill="#52514e">mask IDs, IPs and numbers</text>
  <text x="494" y="254" font-size="12" fill="#52514e">Drain: learn templates, then</text>
  <text x="506" y="272" font-size="12" fill="#52514e">freeze at the time-split cut-off</text>
  <text x="494" y="290" font-size="12" fill="#52514e">group: HDFS block, BGL 5 min</text>
  <text x="494" y="308" font-size="12" fill="#52514e">label; split 70/10/20, both ways</text>

  <rect x="792" y="168" width="250" height="150" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="806" y="194" font-size="14" font-weight="700" fill="#0b0b0b">Model training</text>
  <text x="806" y="218" font-size="12" fill="#52514e">04_baselines.py, 05_deeplog.py</text>
  <text x="806" y="236" font-size="12" fill="#52514e">rules: FATAL line, anomaly-only</text>
  <text x="806" y="254" font-size="12" fill="#52514e">Logistic Regression, Isolation</text>
  <text x="818" y="272" font-size="12" fill="#52514e">Forest (event counts)</text>
  <text x="806" y="290" font-size="12" fill="#52514e">DeepLog LSTM (event order)</text>
  <text x="806" y="308" font-size="12" fill="#52514e">thresholds chosen on validation</text>

  <rect x="1092" y="168" width="228" height="150" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="1106" y="194" font-size="14" font-weight="700" fill="#0b0b0b">Evaluation</text>
  <text x="1106" y="218" font-size="12" fill="#52514e">06_compare.py</text>
  <text x="1106" y="236" font-size="12" fill="#52514e">precision, recall, F1 + 95% CI</text>
  <text x="1106" y="254" font-size="12" fill="#52514e">random split vs time split</text>
  <text x="1106" y="272" font-size="12" fill="#52514e">12: false alarms per day</text>
  <text x="1106" y="290" font-size="12" fill="#52514e">13: error analysis</text>

  <line x1="220" y1="243" x2="268" y2="243" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="245" y="235" font-size="11" fill="#52514e" text-anchor="middle">HTTPS</text>
  <line x1="430" y1="243" x2="478" y2="243" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="455" y="235" font-size="11" fill="#52514e" text-anchor="middle">raw .log</text>
  <line x1="742" y1="243" x2="790" y2="243" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="767" y="235" font-size="11" fill="#52514e" text-anchor="middle">groups</text>
  <line x1="1042" y1="243" x2="1090" y2="243" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="1067" y="235" font-size="11" fill="#52514e" text-anchor="middle">scores</text>

  <!-- row 2 -->
  <rect x="40" y="350" width="390" height="90" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="54" y="376" font-size="14" font-weight="700" fill="#0b0b0b">src/  ·  one shared code base</text>
  <text x="54" y="400" font-size="12" fill="#52514e">parser, features and models are reused by the live API</text>
  <text x="54" y="418" font-size="12" fill="#52514e">tests/: 53 unit tests</text>

  <rect x="480" y="350" width="190" height="90" rx="9" fill="#e7e5df" stroke="#52514e" stroke-width="1.4"/>
  <text x="494" y="376" font-size="14" font-weight="700" fill="#0b0b0b">data/processed/</text>
  <text x="494" y="400" font-size="12" fill="#52514e">sequences, lines, templates</text>
  <text x="494" y="418" font-size="12" fill="#52514e">frozen parser (parser.pkl)</text>

  <rect x="700" y="350" width="150" height="90" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="714" y="376" font-size="14" font-weight="700" fill="#0b0b0b">EDA</text>
  <text x="714" y="400" font-size="12" fill="#52514e">03_eda.py, figures</text>

  <rect x="880" y="350" width="220" height="90" rx="9" fill="#e7e5df" stroke="#52514e" stroke-width="1.4"/>
  <text x="894" y="376" font-size="14" font-weight="700" fill="#0b0b0b">models/</text>
  <text x="894" y="400" font-size="12" fill="#52514e">weights, vocabulary,</text>
  <text x="894" y="418" font-size="12" fill="#52514e">thresholds, normal averages</text>

  <rect x="1130" y="350" width="190" height="90" rx="9" fill="#e7e5df" stroke="#52514e" stroke-width="1.4"/>
  <text x="1144" y="376" font-size="14" font-weight="700" fill="#0b0b0b">reports/</text>
  <text x="1144" y="400" font-size="12" fill="#52514e">figures, results.csv,</text>
  <text x="1144" y="418" font-size="12" fill="#52514e">error-analysis tables</text>

  <line x1="575" y1="318" x2="575" y2="348" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <line x1="670" y1="395" x2="698" y2="395" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <line x1="820" y1="350" x2="820" y2="320" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="828" y="340" font-size="11" fill="#52514e">design decisions</text>
  <line x1="990" y1="318" x2="990" y2="348" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <line x1="1225" y1="318" x2="1225" y2="348" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>

  <!-- ============ ONLINE ============ -->
  <rect x="20" y="520" width="1320" height="410" rx="10" fill="#edf3fb"/>
  <text x="40" y="545" font-size="12.5" font-weight="700" fill="#77756f" letter-spacing="0.6">ONLINE · LIVE DETECTION SYSTEM</text>

  <!-- ============ hand-over ============ -->
  <text x="40" y="500" font-size="12.5" font-weight="700" fill="#0b0b0b">Loaded once at start-up → live decisions match the evaluation (0 mismatches)</text>
  <line x1="600" y1="440" x2="600" y2="603" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="608" y="489" font-size="11" fill="#0b0b0b">frozen parser</text>
  <polyline points="990,440 990,560 780,560 780,603" fill="none" stroke="#0b0b0b" stroke-width="2" marker-end="url(#a-dark)"/>
  <text x="998" y="489" font-size="11" fill="#0b0b0b">models, vocabulary, thresholds</text>
  <polyline points="1225,440 1225,575 1060,575 1060,603" fill="none" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="1233" y="489" font-size="11" fill="#52514e">results.csv</text>

  <!-- docker boundary -->
  <rect x="255" y="590" width="890" height="220" rx="10" fill="none" stroke="#898781" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="269" y="803" font-size="11.5" font-style="italic" fill="#77756f">Docker Compose: one image, three services</text>

  <!-- inputs -->
  <rect x="40" y="605" width="170" height="90" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="54" y="631" font-size="14" font-weight="700" fill="#0b0b0b">Raw log file</text>
  <text x="54" y="655" font-size="12" fill="#52514e">HDFS / BGL test period</text>
  <text x="54" y="673" font-size="12" fill="#52514e">mounted read-only</text>
  <rect x="40" y="715" width="170" height="70" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4" stroke-dasharray="2 3"/>
  <text x="54" y="741" font-size="14" font-weight="700" fill="#0b0b0b">.NET demo app</text>
  <text x="54" y="763" font-size="12" fill="#52514e">logs by request ID</text>

  <!-- log feed -->
  <rect x="270" y="605" width="190" height="180" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="284" y="631" font-size="14" font-weight="700" fill="#0b0b0b">Log feed</text>
  <text x="284" y="655" font-size="12" fill="#52514e">src/replay.py</text>
  <text x="284" y="673" font-size="12" fill="#52514e">replays a log as live</text>
  <text x="284" y="691" font-size="12" fill="#52514e">back-fills 13 h (HDFS)</text>
  <text x="284" y="709" font-size="12" fill="#52514e">~1 request/s, set speed</text>
  <text x="284" y="727" font-size="12" fill="#52514e">+ clock signal (now)</text>

  <!-- scoring API -->
  <rect x="530" y="605" width="330" height="180" rx="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="544" y="631" font-size="14" font-weight="700" fill="#0b0b0b">Scoring API (FastAPI)</text>
  <text x="544" y="653" font-size="11.5" fill="#2a78d6">POST /ingest (live) · POST /score (batch)</text>
  <text x="544" y="675" font-size="12" fill="#52514e">1</text><text x="560" y="675" font-size="12" fill="#52514e">parse with the frozen templates</text>
  <text x="544" y="693" font-size="12" fill="#52514e">2</text><text x="560" y="693" font-size="12" fill="#52514e">group: HDFS block / BGL window</text>
  <text x="544" y="711" font-size="12" fill="#52514e">3</text><text x="560" y="711" font-size="12" fill="#52514e">finished? BGL: next window or clock;</text>
  <text x="560" y="729" font-size="12" fill="#52514e">HDFS: 13 h of silence · cold-start rule</text>
  <text x="544" y="747" font-size="12" fill="#52514e">4</text><text x="560" y="747" font-size="12" fill="#52514e">model: score 0–1 + label</text>
  <text x="544" y="765" font-size="12" fill="#52514e">5</text><text x="560" y="765" font-size="12" fill="#52514e">explain: the events behind the alert</text>

  <!-- dashboard -->
  <rect x="910" y="605" width="220" height="180" rx="9" fill="#ffffff" stroke="#2a78d6" stroke-width="1.6"/>
  <text x="924" y="631" font-size="14" font-weight="700" fill="#0b0b0b">Dashboard (Streamlit)</text>
  <text x="924" y="655" font-size="12" fill="#52514e">live alerts + why flagged</text>
  <text x="924" y="673" font-size="12" fill="#52514e">label check, false alarms/day</text>
  <text x="924" y="691" font-size="12" fill="#52514e">drift: % never-seen messages</text>
  <text x="924" y="709" font-size="12" fill="#52514e">random vs time comparison</text>
  <text x="924" y="727" font-size="12" fill="#52514e">score your own lines</text>

  <!-- operator -->
  <rect x="1180" y="650" width="140" height="90" rx="9" fill="#ffffff" stroke="#52514e" stroke-width="1.4"/>
  <text x="1194" y="676" font-size="14" font-weight="700" fill="#0b0b0b">Operator</text>
  <text x="1194" y="700" font-size="12" fill="#52514e">reviews alerts</text>
  <text x="1194" y="718" font-size="12" fill="#52514e">in a browser</text>

  <!-- alert store (outside Docker: hosted) -->
  <rect x="640" y="840" width="360" height="72" rx="9" fill="#e7e5df" stroke="#52514e" stroke-width="1.4"/>
  <text x="654" y="864" font-size="14" font-weight="700" fill="#0b0b0b">Alert store: PostgreSQL</text>
  <text x="654" y="884" font-size="12" fill="#52514e">hosted on Neon · or a local container</text>
  <text x="654" y="902" font-size="12" fill="#52514e">runs, group_results: score, label, reasons</text>

  <!-- true labels -->
  <rect x="1040" y="840" width="190" height="72" rx="9" fill="#ffffff" stroke="#898781" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="1054" y="864" font-size="13" font-weight="700" fill="#52514e">True labels (dataset)</text>
  <text x="1054" y="884" font-size="12" fill="#52514e">grading only, never live</text>

  <!-- live data path -->
  <line x1="210" y1="650" x2="268" y2="650" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <text x="239" y="642" font-size="11" fill="#2a78d6" text-anchor="middle">lines</text>
  <line x1="210" y1="750" x2="268" y2="750" stroke="#52514e" stroke-width="1.4" stroke-dasharray="2 3" marker-end="url(#a-dark)"/>
  <line x1="460" y1="695" x2="528" y2="695" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <text x="495" y="687" font-size="11" fill="#2a78d6" text-anchor="middle">/ingest</text>
  <text x="495" y="711" font-size="11" fill="#52514e" text-anchor="middle">lines + now</text>
  <line x1="760" y1="785" x2="760" y2="838" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <text x="768" y="830" font-size="11" fill="#2a78d6">saves results</text>
  <line x1="960" y1="838" x2="960" y2="787" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#a-blue)"/>
  <text x="968" y="830" font-size="11" fill="#2a78d6">reads every 5 s</text>

  <!-- other connections -->
  <line x1="908" y1="750" x2="862" y2="750" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="885" y="742" font-size="11" fill="#52514e" text-anchor="middle">/score</text>
  <line x1="1130" y1="695" x2="1178" y2="695" stroke="#52514e" stroke-width="1.6" marker-end="url(#a-dark)"/>
  <text x="1164" y="687" font-size="11" fill="#52514e" text-anchor="middle">views</text>
  <line x1="1100" y1="838" x2="1100" y2="787" stroke="#898781" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#a-muted)"/>
</svg>
